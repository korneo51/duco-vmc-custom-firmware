; ==============================================================================
; Firmware Duco VMC custom — ESP32, sans ESPHome
; PlatformIO + Arduino framework
; ==============================================================================
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

; Bibliothèques tierces
lib_deps =
    knolleary/PubSubClient @ ^2.8
    ESP32Async/ESPAsyncWebServer @ ^3.6.0
    ESP32Async/AsyncTCP @ ^3.3.2
    bblanchon/ArduinoJson @ ^7.0.4

; OTA après la première fois
; upload_protocol = espota
; upload_port    = duco-vmc.local
; upload_flags   = --auth=REMPLACER_PAR_OTA_PASS

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=1

[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = duco-vmc.local
extra_scripts = pre:scripts/ota_flags.py
